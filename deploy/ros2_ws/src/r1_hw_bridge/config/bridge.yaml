# Bridge defaults. Gains are the ones to argue about before the first hanging
# run; everything else is protocol.
/**:
  ros__parameters:
    iface: "eth10"           # measured in stage 2; `ip -brief addr` to confirm
    dds_domain: 0
    control_rate_hz: 50.0    # must equal the policy's; it is what training used
    cmd_rate_hz: 500.0       # motor bus rate; the PD loop itself is in firmware
    enable_output: false     # SAFETY: opt in, never default
    check_state_crc: true
    # Gains are per joint, from the training config (see kKp/kKd in
    # joint_map.hpp, generated from interface/actuator_gains.json). These only
    # scale them, and 1.0 IS the trained controller -- ramp with kp_scale so the
    # endpoint of the ramp is a known quantity instead of a guessed number.
    kp_scale: 1.0
    kd_scale: 1.0            # also the damping used in the degraded state
    lowstate_timeout_ms: 100.0
    target_timeout_ms: 60.0  # 3 control cycles at 50 Hz
    min_control_rate_hz: 45.0
    auto_recover: false      # recovery is explicit, via ~/resume
